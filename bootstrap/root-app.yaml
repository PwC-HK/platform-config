# App-of-apps: apply this once after installing the OpenShift GitOps operator.
# Argo CD then manages every app in apps/ from this repo — the only path to the cluster.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: devsecops-demo
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/PwC-HK/platform-config.git
        revision: main
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      name: "{{index .path.segments 1}}-{{index .path.segments 3}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/PwC-HK/platform-config.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 1}}-{{index .path.segments 3}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
